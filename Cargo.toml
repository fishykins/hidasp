[package]
name = "hidasp"
version = "0.1.0"
edition = "2021"
authors = ["Fishykins <caspar.m.green@gmail.com>"]
description = "Hid-and-seek-protocol for mapping out hid compliant devices."
keywords = ["HID", "input", "jostick", "controller"]
license = "MIT/Apache-2.0"
repository = "https://github.com/fishykins/hid-and-seek"

[features]
default = ["buffer_map"]
buffer_map = []

[dependencies]
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }